<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Temporary Password - CareDischarge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo" style="background: var(--status-pending);">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="auth-title">Update Your Password</h2>
                <p class="auth-subtitle">A password change is required for your account security</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.change_password') }}">
                <div class="form-group">
                    <label class="form-label" for="old_password">Temporary / Current Password</label>
                    <input type="password" id="old_password" name="old_password" class="form-control" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="new_password">New Strong Password</label>
                    <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Minimum 6 characters" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    <i class="fa-solid fa-lock"></i> Set New Password & Continue
                </button>
            </form>
        </div>
    </div>
</body>
</html>
