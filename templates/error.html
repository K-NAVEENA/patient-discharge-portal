<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ error_code }} - CareDischarge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card" style="text-align: center;">
            <div class="auth-logo" style="background-color: var(--status-blocked); margin: 0 auto 16px auto;">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h2 class="auth-title">System Notice: {{ error_code }}</h2>
            <p style="font-size: 15px; color: var(--text-muted); margin: 12px 0 24px 0; line-height: 1.5;">
                {{ error_message or "An unexpected system condition occurred." }}
            </p>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <a href="{{ url_for('auth.role_dashboard') }}" class="btn btn-primary">
                    <i class="fa-solid fa-house"></i> Return to Portal Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
