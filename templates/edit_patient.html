{% extends "base.html" %}

{% block title %}Edit Patient - {{ patient.full_name }}{% endblock %}
{% block page_title %}Edit Permitted Demographic Details{% endblock %}

{% block content %}
<div class="card" style="max-width: 680px; margin: 0 auto;">
    <div class="card-header">
        <h3><i class="fa-solid fa-pen-to-square"></i> Edit Patient: {{ patient.patient_id }}</h3>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.edit_patient', patient_id=patient.id) }}">
            <div class="form-group">
                <label class="form-label" for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" value="{{ patient.full_name }}" class="form-control" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" value="{{ patient.phone }}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ patient.email or '' }}" class="form-control">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="address">Address</label>
                <textarea id="address" name="address" class="form-control" rows="2">{{ patient.address or '' }}</textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="emergency_contact_name">Emergency Contact Name</label>
                    <input type="text" id="emergency_contact_name" name="emergency_contact_name" value="{{ patient.emergency_contact_name or '' }}" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label" for="emergency_contact_phone">Emergency Contact Phone</label>
                    <input type="text" id="emergency_contact_phone" name="emergency_contact_phone" value="{{ patient.emergency_contact_phone or '' }}" class="form-control">
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
                <a href="{{ url_for('admin.view_patient', patient_id=patient.id) }}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Save Demographic Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
